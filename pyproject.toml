# Бекенд — hatchling: чистый Python, в изоляции ставится одним колесом и
# ничего не собирает сам. setuptools убран 09.09.2026: его сборка в кэше uv
# рвётся от самого пути к кэшу — на пробеле в пути (замер ворот: обрыв на
# самом глубоком файле самого setuptools) и на длинном пути (замер здесь:
# «имя файла слишком длинное» при создании build\bdist), а у пользователя
# кэш uv лежит именно под таким путём. Второе: setuptools собирает через
# build/lib, и каталог, оставшийся от прошлой сборки, кладёт в колесо давно
# удалённые модули — hatchling берёт файлы из src/garant_mcp.
[build-system]
requires = ["hatchling>=1.27"]  # PEP 639: поле license строкой SPDX
build-backend = "hatchling.build"

[project]
name = "garant-mcp"
description = "MCP-сервер над правовой базой «Гарант»: доступ даёт собственная подписка пользователя"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dynamic = ["version"]

dependencies = [
    # Верхняя граница у mcp не декоративная: в 2.x FastMCP переименован
    # в MCPServer, а server.py написан под 1.x. С mcp 2.x импорт сервера падает
    # на строке «from mcp.server.fastmcp import FastMCP», и выглядит это как
    # поломка сервера, а не как несовместимость версий.
    "mcp>=1.2,<2",
    "playwright>=1.44",
    # Единственный источник истины о расположении состояния (paths.py).
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
garant = "garant_mcp.cli:main"
garant-mcp = "garant_mcp.server:main"
garant-daemon = "garant_mcp.daemon:main"

[tool.hatch.version]
# Версия объявлена ровно в одном месте — garant_mcp/__init__.py.
path = "src/garant_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
# Раскладка src/: без этой строки hatchling ищет пакет с именем проекта
# (garant-mcp) и не находит его. endpoints.json лежит внутри пакета и едет
# в колесе вместе с ним — без него клиент не запускается вовсе: в нём вся
# карта эндпоинтов.
packages = ["src/garant_mcp"]

# Перечень, а не «всё, кроме игнорируемого». Умолчание hatchling для sdist —
# взять корень целиком, вычтя образцы из ТЕКСТА .gitignore; про состояние git
# он не знает ничего, и файл, который лежит в рабочем каталоге, но ни под один
# образец не подпадает, уезжает в дистрибутив молча. Так в sdist попали два
# рабочих файла владельца (ворота 09.09.2026). Запрет строится на том, что
# перечислено, а не на том, что забыли перечислить в .gitignore: забыть
# образец можно, а вписать сюда посторонний файл руками — нет.
[tool.hatch.build.targets.sdist]
only-include = ["src/garant_mcp", "README.md", "LICENSE", "NOTICE",
                "pyproject.toml"]

# Набор правил назван явно, потому что CI ставит `.[dev]` — то есть ruff
# СВЕЖИЙ, какой выйдет ко дню сборки. Без выбора он включает всё, что успело
# появиться в новой версии (на 0.16 это четыре с лишним сотни правил, из них
# сотни — вкусовые: f-строки вместо `format`, порядок импортов), и очередной
# релиз линтера красит сборку, в которой ни строки не менялось. Выбран
# классический набор — ошибки, а не вкусы: под него код и писался.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# F811 в tests — не переопределение, а идиома pytest: фикстура импортируется
# из общего модуля и тем же именем принимается параметром теста. Правило
# видит второе связывание имени и не видит, что вызов делает pytest.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]
